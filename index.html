<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro de service · Malelo</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap" rel="stylesheet">
<style>
/* Una columna de celular en bandas negras y grafito: arriba el tablero (testigos que se prenden como al arrancar el auto + cuentakilómetros), después cada ítem sobre chapa semillada, con su bandera de carrera. */
:root{
  --negro:#000;
  --grafito:#1c1c1e;
  --acero:#29292c;
  --panel:#141415;
  --linea:#38383c;
  --hueso:#f3eadc;
  --gris:#a4a4aa;
  --amarillo:#ffc000;
  --naranja:#f26a1b;
  --rojo:#d7261e;
  --verde:#3fb96b;
  --placa:#1f3f99;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-texto:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;position:relative;background:var(--negro);color:var(--hueso);font:400 16.5px/1.5 var(--f-texto);font-stretch:100%}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding-inline:18px}
button{font:inherit}
:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}

/* cabecera con franjas de carrera */
.top{position:relative;overflow:hidden;padding-block:18px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px}
.logo{height:44px;width:auto;display:block;filter:invert(1) hue-rotate(180deg)}
.top-nom{font:italic 800 22px/1 var(--f-display);font-stretch:80%}
.top-txt{font:italic 800 21px/1.02 var(--f-display);font-stretch:78%;text-align:right;color:var(--hueso);letter-spacing:.2px}
.franjas{display:grid;gap:4px;margin-top:16px;padding-left:22%;position:relative}
.franjas i{display:block;height:6px;clip-path:polygon(14px 0,100% 0,100% 100%,0 100%)}
.franjas i:nth-child(1){background:var(--amarillo);margin-left:28px}
.franjas i:nth-child(2){background:var(--naranja);margin-left:14px}
.franjas i:nth-child(3){background:var(--rojo)}
.top .franjas i{animation:entra .75s cubic-bezier(.2,.8,.2,1) both}
.top .franjas::after{content:"";position:absolute;inset:0 0 0 22%;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);background-size:300% 100%;mix-blend-mode:overlay;animation:brillo-franja 4.8s ease-in-out 1.4s infinite;pointer-events:none}
@keyframes brillo-franja{0%{background-position:120% 0}45%,100%{background-position:-30% 0}}
.top .franjas i:nth-child(2){animation-delay:.09s}
.top .franjas i:nth-child(3){animation-delay:.18s}
@keyframes entra{from{transform:translateX(110%)}to{transform:none}}
.top::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(243,234,220,.08) 1px,transparent 1.3px);background-size:6px 6px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none}

/* promo */
.promo{position:relative;overflow:hidden;margin-top:18px;border:2px solid var(--amarillo);border-radius:12px;padding:12px 14px;background:#1c1606}
.promo::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,214,102,.2) 50%,transparent 65%);transform:translateX(-100%);animation:destello 5.5s ease-in-out 2s infinite;pointer-events:none}
@keyframes destello{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.promo strong{display:block;font:italic 800 20px/1.15 var(--f-display);font-stretch:80%}
.promo p{margin:4px 0 0;font-size:15px;color:var(--hueso)}
.promo a{display:inline-flex;align-items:center;min-height:44px;margin-top:2px;color:var(--amarillo);font-weight:700}

/* auto */
.auto{padding-block:22px 4px}
.placa{display:inline-flex;flex-direction:column;border:2.5px solid #000;border-radius:7px;overflow:hidden;background:#fff;min-width:178px;box-shadow:0 0 0 2px #2b2b2b}
.placa-band{background:var(--placa);color:#fff;font:600 9.5px/1 var(--f-texto);letter-spacing:1.6px;text-align:center;padding:4px 8px 3px}
.placa-num{font:700 34px/1 var(--f-display);font-stretch:85%;letter-spacing:3px;text-align:center;padding:5px 12px 6px;color:#000;font-variant-numeric:tabular-nums}
.auto h1{margin:14px 0 0;font:italic 900 40px/1 var(--f-display);font-stretch:72%;letter-spacing:.3px;text-wrap:balance}
.auto p{margin:4px 0 0;color:var(--gris);font-size:15.5px}
.auto.nada h1{margin-top:6px;font-size:34px}
.auto.nada p{color:var(--hueso);font-size:16.5px;margin-top:10px}

.alerta{display:flex;gap:12px;align-items:flex-start;margin-top:18px;background:var(--rojo);color:#fff;border-radius:12px;padding:12px 14px}
.alerta svg{flex:none;margin-top:2px}
.alerta strong{display:block;font-weight:700}
.alerta span{font-size:15px}

/* tablero */
.tablero{margin-top:22px;padding:16px 16px 20px;border-radius:18px;background:linear-gradient(180deg,#2d2d31 0%,#18181a 55%,#111113 100%);border:1px solid var(--linea);box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 18px 40px rgba(0,0,0,.6)}
.tablero h2{margin:0 0 10px;font:italic 800 22px/1.1 var(--f-display);font-stretch:80%}
.testigos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border-radius:12px;background:#050505;box-shadow:inset 0 2px 10px rgba(0,0,0,.95),0 0 0 1px #3a3a3e}
.testigo{appearance:none;-webkit-appearance:none;border:0;background:transparent;display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;color:#3a3a3f;cursor:pointer;transition:color .2s,filter .2s;-webkit-tap-highlight-color:transparent}
.testigo svg{width:30px;height:30px}
.testigo.check{color:#ffb000;filter:drop-shadow(0 0 7px rgba(255,176,0,.9))}
.testigo.l-rojo{color:#ff3b30;filter:drop-shadow(0 0 7px rgba(255,59,48,.9));animation:latido 1.8s ease-in-out infinite}
.testigo.l-ambar{color:#ffb000;filter:drop-shadow(0 0 6px rgba(255,176,0,.8))}
.testigo.l-verde{color:#3fb96b;filter:drop-shadow(0 0 4px rgba(63,185,107,.5))}
@keyframes latido{50%{opacity:.55;filter:drop-shadow(0 0 2px rgba(255,59,48,.5))}}
.resumen{margin:10px 2px 0;font-size:14.5px;color:var(--gris)}
.resumen b{color:var(--hueso);font-weight:600}
.meta{margin-top:16px;padding-top:16px;border-top:1px dashed #444449}
.meta.primero{margin-top:4px;padding-top:0;border-top:0}
.meta-label{margin:0 0 8px;font-weight:600;font-size:15.5px}
.odo-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.odo{display:flex;gap:3px;padding:6px;background:#1b1b1b;border-radius:9px;box-shadow:0 0 0 1px #4a4a4a,inset 0 1px 0 #333}
.odo .sep{width:7px}
.drum{position:relative;width:36px;height:52px;overflow:hidden;border-radius:4px;background:linear-gradient(#0a0a0a,#262626 22%,#2e2e2e 50%,#262626 78%,#0a0a0a)}
.drum::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.strip{display:flex;flex-direction:column;transition:transform 1.3s cubic-bezier(.2,.75,.25,1)}
.strip span{height:52px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 38px/1 var(--f-display);font-stretch:80%}
.drum.ult{background:linear-gradient(#bfbfbf,#fff 25%,#fff 75%,#bfbfbf)}
.drum.ult .strip span{color:#000}
.odo-unit{font:italic 800 24px/1 var(--f-display);font-stretch:80%;padding-bottom:6px}
.odo.chico .drum{width:26px;height:38px}
.odo.chico .strip span{height:38px;font-size:27px}
.fecha{margin:10px 0 0}
.fecha strong{color:#fff}
.fecha-grande{margin:0;font:italic 900 40px/1 var(--f-display);font-stretch:74%}
.fecha-grande.chica{font-size:30px}
.toca{margin:6px 0 0;color:var(--gris);font-size:15px}

.dist{margin-top:16px;padding-top:16px;border-top:1px dashed #444449}
.dist-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.dist-top .meta-label{margin:0}
.dist-vacio{margin-top:16px;padding:14px;border:1px dashed #55555b;border-radius:12px}
.dist-vacio strong{display:block;font-size:16.5px;margin-bottom:4px}
.dist-vacio p{margin:0;color:var(--gris);font-size:15px}
.dist-vacio a{display:inline-flex;align-items:center;min-height:44px;margin-top:2px;color:var(--amarillo);font-weight:700}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:12px;border:0;cursor:pointer;font:700 18px/1.1 var(--f-texto);text-decoration:none;padding:0 16px;text-align:center}
.btn svg{flex:none}
.btn-wa{position:relative;margin-top:18px;background:var(--amarillo);color:#000;box-shadow:0 3px 0 #b88a00}
.btn-wa::after{content:"";position:absolute;inset:0;border-radius:inherit;animation:pulso 2.8s ease-out 2.4s infinite;pointer-events:none}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(255,192,0,.55)}70%,100%{box-shadow:0 0 0 16px rgba(255,192,0,0)}}
.btn-sec{margin-top:14px;min-height:52px;background:var(--hueso);color:#000;font-size:16.5px}

/* el mecánico recomienda */
.reco{margin-top:16px;padding:14px 16px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--linea)}
.reco h2{margin:0 0 4px;font:italic 800 22px/1.1 var(--f-display);font-stretch:80%}
.reco-fila{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--linea)}
.reco-fila:first-of-type{border-top:0}
.reco-fila b{display:block;font-weight:600}
.reco-fila small{display:block;margin-top:2px;color:var(--gris);font-size:13.5px;line-height:1.35}

/* banderas */
.bandera{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;white-space:nowrap}
.b-verde{color:var(--verde)} .b-amarillo{color:var(--amarillo)} .b-rojo{color:#ff5a4f}

/* ítems */
section{padding-block:36px}
.banda{background-color:var(--grafito);border-block:1px solid #2a2a2d}
.chapa{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26'><g stroke-linecap='round' stroke-width='2.4'><path d='M3.5 9.5l6-6M16.5 22.5l6-6' stroke='%23ffffff' stroke-opacity='.07'/><path d='M16.5 3.5l6 6M3.5 16.5l6 6' stroke='%23000000' stroke-opacity='.35'/></g></svg>"),linear-gradient(180deg,rgba(255,255,255,.035),transparent 50%)}
.sec-head h2{margin:0;font:italic 900 30px/1.05 var(--f-display);font-stretch:74%}
.sec-head p{margin:6px 0 0;color:var(--gris);font-size:15px}
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.item{background:var(--acero);border:1px solid var(--linea);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;min-width:0}
.item.rojo{border-color:#7a2019;background:#2b1615}
.item.amarillo{border-color:#6b5614}
.item.marcado{animation:marca 1.4s ease}
@keyframes marca{0%,60%{box-shadow:0 0 0 3px var(--amarillo)}100%{box-shadow:0 0 0 0 transparent}}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap}
.item svg.ico{color:var(--hueso);flex:none}
.item h3{margin:0;font:700 15.5px/1.2 var(--f-texto);overflow-wrap:anywhere}
.item p{margin:0;color:var(--gris);font-size:13.5px;line-height:1.35}
.item p b{color:var(--hueso);font-weight:600}
.vacio{color:var(--gris);margin:14px 0 0}

.obs{margin-top:16px;background:var(--acero);border:1px solid var(--linea);border-left:4px solid var(--amarillo);border-radius:12px;padding:14px}
.obs p{margin:0;white-space:pre-line}
.obs small{display:block;margin-top:6px;color:var(--gris);font-size:13px}

/* control general (solo si se vuelve a activar en el PLAN) */
.ctrl h3{margin:22px 0 4px;font:italic 800 19px/1.1 var(--f-display);font-stretch:80%}
.ctrl ul{list-style:none;margin:0;padding:0}
.ctrl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
.ctrl li:first-child{border-top:0}

/* reseña */
.resena-card{position:relative;overflow:hidden;background:var(--amarillo);color:#000;border-radius:16px;padding:20px 18px}
.resena-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.resena-card h2{margin:0 0 4px;font:italic 900 30px/1.05 var(--f-display);font-stretch:74%}
.resena-card p{margin:0;font-weight:500}
.estrellas{display:flex;gap:6px;margin-bottom:12px}
.estrellas svg{animation:titila 3.4s ease-in-out infinite}
.estrellas svg:nth-child(2){animation-delay:.12s}.estrellas svg:nth-child(3){animation-delay:.24s}.estrellas svg:nth-child(4){animation-delay:.36s}.estrellas svg:nth-child(5){animation-delay:.48s}
@keyframes titila{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.2)}}
.btn-google{position:relative;z-index:1;margin-top:16px;background:#000;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}

/* las tarjetas entran al aparecer en pantalla */
.revela.espera{opacity:0}
.revela.visto{animation:aparece .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes aparece{from{opacity:0;transform:translateY(20px) scale(.97)}}
.item.revela.marcado{animation:marca 1.4s ease}

/* historial */
details{border-top:1px solid var(--linea)}
details:last-of-type{border-bottom:1px solid var(--linea)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:600}
summary::-webkit-details-marker{display:none}
summary .der{display:flex;align-items:center;gap:10px}
summary .km{font:700 17px/1 var(--f-display);font-stretch:85%;color:var(--gris);font-variant-numeric:tabular-nums}
summary .chev{color:var(--gris);transition:transform .2s}
details[open] summary .chev{transform:rotate(180deg)}
.hist{padding:0 0 14px;color:var(--gris);font-size:15px}
.hist p{margin:4px 0}
.hist b{color:var(--hueso);font-weight:600}

/* pie */
footer{padding-block:0 calc(34px + env(safe-area-inset-bottom,0px))}
main + footer{margin-top:36px}
footer .franjas{margin:0 0 24px;padding-left:0;padding-right:22%}
footer .franjas i{clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
footer .franjas i:nth-child(1){margin:0 28px 0 0}
footer .franjas i:nth-child(2){margin:0 14px 0 0}
.pie-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
footer .logo{height:52px}
footer .nom{font:italic 800 24px/1.1 var(--f-display);font-stretch:80%;margin:0}
.cuadros{flex:none}
.cuadros .tela{transform-box:fill-box;transform-origin:0 50%;animation:ondea 1.6s ease-in-out infinite alternate}
@keyframes ondea{from{transform:skewY(-5deg) scaleX(.96)}to{transform:skewY(5deg) scaleX(1)}}
footer p{margin:6px 0;color:var(--hueso)}
footer .dir{color:var(--hueso);text-underline-offset:3px}
footer .wa{display:inline-flex;align-items:center;gap:8px;color:var(--amarillo);font-weight:700;min-height:44px;text-decoration:underline;text-underline-offset:3px}
footer .wa svg{flex:none}
footer .chico{color:var(--gris);font-size:13px;margin-top:16px}

/* huellas de gatito: pegadas a la página (se mueven con el scroll), muy tenues, no se pueden tocar */
.huellas{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.huella{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;color:var(--hueso);opacity:0;animation:pisada 5s ease-out forwards}
@keyframes pisada{0%{opacity:0;transform:var(--giro) scale(.6)}6%{opacity:.17;transform:var(--giro) scale(1)}55%{opacity:.13}100%{opacity:0;transform:var(--giro) scale(1)}}

@media (prefers-reduced-motion: reduce){ .strip,.testigo,summary .chev{transition:none} .testigo.l-rojo,.top .franjas i,.item.marcado,.item.revela.marcado,.top .franjas::after,.promo::after,.btn-wa::after,.estrellas svg,.revela.visto,.cuadros .tela{animation:none} }
@media (min-width:480px){ .drum{width:42px;height:60px} .strip span{height:60px;font-size:44px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="huellas" id="huellas" aria-hidden="true"></div>
<script src="config.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var v = (q.get('v') || '').trim();
  if (q.get('modo') === 'sticker' && v) { location.replace('sticker.html?v=' + encodeURIComponent(v)); return; }
  if (!v) { location.replace('taller.html'); return; }
  var app = document.getElementById('app');
  var caja = 'min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 24px;';
  app.innerHTML = '<div style="' + caja + 'color:#a4a4aa;font-size:16px;font-family:Archivo,system-ui,sans-serif"><img src="logo.png" alt="Malelo" style="height:46px;filter:invert(1) hue-rotate(180deg)"><span>Cargando el registro…</span></div>';
  var pedido = fetch(window.MALELO_API + '?api=cliente&v=' + encodeURIComponent(v)).then(function(r){ return r.json(); });
  window.__arranque = function(){
    pedido.then(function(j){
      if (!j || !j.ok) throw new Error((j && j.error) || 'Error');
      window.DATA = j.data;
      if (j.data && j.data.vehiculo) document.title = 'Service ' + j.data.vehiculo.patente + ' · Malelo';
      window.__main();
    }).catch(function(){
      app.innerHTML = '<div style="' + caja + 'color:#f3eadc;font-family:Archivo,system-ui,sans-serif"><p style="margin:0;font-size:17px">No se pudo cargar el registro. Revisá la conexión y probá de nuevo.</p>' +
        '<button type="button" onclick="location.reload()" style="min-height:50px;padding:0 24px;border:0;border-radius:12px;background:#ffc000;color:#000;font:700 17px Archivo,system-ui,sans-serif;cursor:pointer">Reintentar</button></div>';
    });
  };
})();
</script>
<script>
window.__main = function(){
  var D = window.DATA || {ok:false, negocio:{}};
  var N = D.negocio || {};
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function parte(iso){var p=String(iso||'').split('-');return p.length===3&&+p[1]>=1&&+p[1]<=12?{y:+p[0],m:+p[1],d:+p[2]}:null;}
  function fLarga(iso){var p=parte(iso);return p?p.d+' de '+MESES[p.m-1]+' de '+p.y:'';}
  function fCorta(iso){var p=parte(iso);return p?MESES[p.m-1].slice(0,3)+' '+p.y:'';}
  function fMes(iso){var p=parte(iso);return p?MESES[p.m-1].charAt(0).toUpperCase()+MESES[p.m-1].slice(1)+' de '+p.y:'';}
  function km(n){n=Math.round(+n||0);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
  function lista(a){a=a.filter(Boolean);if(a.length<2)return a.join('');return a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
  function wa(msg){return N.whatsapp?'https://wa.me/'+N.whatsapp+'?text='+encodeURIComponent(msg):'';}
  var quieto = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---------- íconos ----------
  var ICON_CHAT='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11c0 2.2 1 4.2 2.6 5.6L5 21l4.2-2.2c.9.2 1.8.3 2.8.3 5.1 0 9-3.6 9-8.1S17.1 3 12 3zm-4 9.3a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6z"/></svg>';

    if(N.horario) f += '<p>'+esc(N.horario)+'</p>';
    var msgPie = 'Hola! Te escribo desde el registro de service'+(V.patente?' de mi '+nombreAuto+' ('+V.patente+')':'')+'.';
    if(wa(msgPie)) f += '<p><a class="wa" target="_blank" rel="noopener" href="'+esc(wa(msgPie))+'" aria-label="Escribinos por WhatsApp al '+esc(N.telefono||N.whatsapp)+'">'+ICON_WA+'<span>'+esc(N.telefono||('+'+N.whatsapp))+'</span></a></p>';
    else if(N.telefono) f += '<p><a class="wa" target="_top" href="tel:'+esc(String(N.telefono).replace(/[^\d+]/g,''))+'">'+esc(N.telefono)+'</a></p>';
    f += '<p class="chico">Registro cargado por el taller en cada visita. Los vencimientos son por kilometraje o por fecha, lo que llegue primero.</p></div></footer>';
    return f;
  }

  function arrancar(){
    // testigos: se prenden todos (como al dar contacto) y quedan solo los que importan
    var testigos = document.querySelectorAll('.testigo');
    function asentar(){
      Array.prototype.forEach.call(testigos, function(l, k){
        setTimeout(function(){ l.classList.remove('check'); l.classList.add(l.getAttribute('data-luz')); }, quieto ? 0 : k * 110);
      });
    }
    if(quieto) asentar();
    else { Array.prototype.forEach.call(testigos, function(l){ l.classList.add('check'); }); setTimeout(asentar, 1000); }

    // rodillos del cuentakilómetros
    requestAnimationFrame(function(){ requestAnimationFrame(function(){
      var strips = document.querySelectorAll('.strip');
      for(var k=0;k<strips.length;k++){ strips[k].style.transitionDelay=(k*0.07)+'s'; strips[k].style.transform='translateY(-'+(+strips[k].getAttribute('data-d')*10)+'%)'; }
    });});

    // las tarjetas entran cuando aparecen en pantalla
    var obs = null;
    function mostrar(el){ el.classList.remove('espera'); el.classList.add('visto'); if(obs) obs.unobserve(el); }
    if(!quieto && 'IntersectionObserver' in window){
      obs = new IntersectionObserver(function(es){
        es.forEach(function(e){
          if(!e.isIntersecting) return;
          var el = e.target, pos = Array.prototype.indexOf.call(el.parentNode.children, el);
          el.style.animationDelay = ((pos % 4) * 0.08) + 's';
          mostrar(el);
        });
      }, { threshold: 0.15 });
      Array.prototype.forEach.call(document.querySelectorAll('.revela'), function(el){ el.classList.add('espera'); obs.observe(el); });
    }

    // tocar un testigo lleva a su tarjeta
    document.addEventListener('click', function(ev){
      var l = ev.target.closest && ev.target.closest('.testigo'); if(!l) return;
      var it = document.getElementById(l.getAttribute('data-ir')); if(!it) return;
      if(it.classList.contains('espera')) { it.style.animationDelay = '0s'; mostrar(it); }
      it.scrollIntoView({ behavior: quieto ? 'auto' : 'smooth', block: 'center' });
      it.classList.remove('marcado'); void it.offsetWidth; it.classList.add('marcado');
    });

    // un gatito que camina por la página: deja huellas tenues, en recorridos al azar, con pausas cortas
    if(quieto) return;
    var capa = document.getElementById('huellas'); if(!capa) return;
    var PATA = '<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><ellipse cx="12" cy="15.5" rx="5" ry="4.2"/><circle cx="6.3" cy="9.8" r="2"/><circle cx="9.9" cy="6.6" r="2.1"/><circle cx="14.1" cy="6.6" r="2.1"/><circle cx="17.7" cy="9.8" r="2"/></svg>';
    function azar(a, b){ return a + Math.random() * (b - a); }
    function caminata(){
      if(document.hidden){ setTimeout(caminata, 4000); return; }
      // coordenadas de la página, no de la pantalla: las huellas quedan "pisadas" sobre el contenido
      var W = capa.clientWidth, alto = capa.clientHeight, H = window.innerHeight;
      var desde = window.pageYOffset || document.documentElement.scrollTop || 0;
      var y = desde + azar(H * .2, H * .8), x, rumbo;
      // entra por un costado de lo que se está viendo
      if(Math.random() < .5){ x = -10; rumbo = azar(-.6, .6); }
      else { x = W + 10; rumbo = Math.PI + azar(-.6, .6); }
      var pasos = Math.round(azar(20, 34)), n = 0, lado = 1;
      (function paso(){
        rumbo += azar(-.22, .22);
        x += Math.cos(rumbo) * 26; y += Math.sin(rumbo) * 26;
        lado = -lado;
        var px = x + Math.cos(rumbo + Math.PI / 2) * 6 * lado, py = y + Math.sin(rumbo + Math.PI / 2) * 6 * lado;
        if(px > -20 && px < W + 20 && py > 10 && py < alto - 10){
          var hu = document.createElement('div');
          hu.className = 'huella';
          hu.style.left = px + 'px'; hu.style.top = py + 'px';
          hu.style.setProperty('--giro', 'rotate(' + (rumbo * 180 / Math.PI + 90) + 'deg)');
          hu.innerHTML = PATA;
          capa.appendChild(hu);
          setTimeout(function(){ if(hu.parentNode) hu.parentNode.removeChild(hu); }, 5200);
        }
        n++;
        var afuera = x < -40 || x > W + 40 || y < 0 || y > alto;
        if(n < pasos && !afuera) setTimeout(paso, azar(250, 370));
        else setTimeout(caminata, azar(1200, 3500));
      })();
    }
    setTimeout(caminata, 1200);
  }
};
if (window.__arranque) window.__arranque();
</script>
