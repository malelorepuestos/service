<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro de service · Malelo</title>
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000;
  --fondo:#000;
  --panel:#141414;
  --titulo:#fff;
  --texto:#e4e4e4;
  --gris:#a3a9b1;
  --linea:#2d2d2d;
  --blanco:#fff;
  --ambar:#FFC000;
  --naranja:#CA5B07;
  --ok-tx:#8fe3ac; --ok-bg:#12321f;
  --av-tx:#ffd25c; --av-bg:#3a2d00;
  --mal:#d32f2f;
  --placa-azul:#1f3f99;
  color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--texto);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.45}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
h2{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:700;font-size:27px;line-height:1.1;margin:0 0 14px;color:var(--titulo);letter-spacing:.2px}
h3{font-family:"Barlow Condensed",Barlow,sans-serif;font-weight:600;font-size:19px;margin:18px 0 6px;color:var(--titulo)}
section{padding:28px 0}
.banda{background:var(--panel)}

/* cabecera */
.top{padding:18px 0 8px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{height:46px;width:auto;display:block;filter:invert(1) hue-rotate(180deg)}
.top-txt{font:700 25px/1 "Barlow Condensed",Barlow,sans-serif;color:var(--titulo);text-align:right;letter-spacing:.3px}

/* hero */
.hero{padding:14px 0 30px}
.placa{display:inline-flex;flex-direction:column;border:2.5px solid var(--negro);border-radius:7px;overflow:hidden;background:#fff;min-width:178px}
.placa-band{background:var(--placa-azul);color:#fff;font:600 9.5px/1 Barlow,sans-serif;letter-spacing:1.6px;text-align:center;padding:4px 8px 3px}
.placa-num{font:700 34px/1 "Barlow Condensed",sans-serif;letter-spacing:3px;text-align:center;padding:5px 12px 6px;color:var(--negro)}
.auto{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:34px;line-height:1.05;margin:14px 0 2px;color:var(--titulo)}
.auto-sub{margin:0;color:var(--gris);font-size:15px}
.alerta{margin:20px 0 0;background:var(--mal);color:#fff;border-radius:10px;padding:12px 14px;font-weight:600;font-size:16px}
.alerta span{font-weight:400;display:block;font-size:15px;opacity:.95}
.prox-label{margin:26px 0 8px;font-size:16px;font-weight:600;color:var(--titulo)}
.odo-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.odo{display:flex;gap:3px;padding:6px;background:#1b1b1b;border-radius:9px;box-shadow:0 0 0 1px #4a4a4a,inset 0 1px 0 #333}
.odo .sep{width:7px}
.drum{position:relative;width:38px;height:56px;overflow:hidden;border-radius:4px;background:linear-gradient(#0a0a0a,#262626 22%,#2e2e2e 50%,#262626 78%,#0a0a0a)}
.drum::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(0,0,0,.55));pointer-events:none}
.strip{display:flex;flex-direction:column;transform:translateY(0);transition:transform 1.3s cubic-bezier(.2,.75,.25,1)}
.strip span{height:56px;display:flex;align-items:center;justify-content:center;color:#fff;font:700 40px/1 "Barlow Condensed",sans-serif}
.drum.ult{background:linear-gradient(#bfbfbf,#fff 25%,#fff 75%,#bfbfbf)}
.drum.ult .strip span{color:var(--negro)}
.odo-unit{font:700 26px/1 "Barlow Condensed",sans-serif;color:var(--titulo);padding-bottom:6px}
.prox-fecha-grande{font:700 46px/1 "Barlow Condensed",sans-serif;color:var(--titulo);margin:0}
.prox-o{margin:12px 0 0;font-size:17px}
.prox-o strong{color:var(--titulo)}
.prox-items{margin:6px 0 0;color:var(--gris);font-size:15px}
.dist{margin-top:26px;padding-top:22px;border-top:1px solid var(--linea)}
.dist .prox-label{margin-top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dist-vacio{margin-top:26px;padding:14px;border:1px dashed #4a4a4a;border-radius:10px}
.dist-vacio strong{display:block;color:var(--titulo);font-size:17px;margin-bottom:4px}
.dist-vacio p{margin:0;color:var(--gris);font-size:15px}
.dist-vacio a{display:inline-block;margin-top:8px;color:var(--ambar);font-weight:700;font-size:15.5px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:56px;border-radius:12px;font:700 18px/1.1 Barlow,sans-serif;text-decoration:none;border:0;cursor:pointer;padding:0 16px}
.btn-turno{margin-top:24px;background:var(--ambar);color:var(--negro);box-shadow:0 2px 0 #c99700}
.btn-sec{margin-top:16px;background:var(--blanco);color:var(--negro);min-height:50px;font-size:16px}
.btn svg{flex:none}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--naranja);outline-offset:2px}

/* último service */
.ult-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ult-fecha{font-weight:700;color:var(--titulo);font-size:18px}
.ult-km{font:600 20px/1 "Barlow Condensed",sans-serif;color:var(--titulo);background:transparent;border:1.5px solid var(--titulo);border-radius:6px;padding:4px 8px}
.cambios{list-style:none;margin:0;padding:0}
.cambios li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--linea)}
.cambios li:first-child{border-top:0}
.cambios svg{flex:none;margin-top:3px}
.det{display:block;color:var(--gris);font-size:15px}
.revisados{margin:12px 0 0;font-size:15px;color:var(--gris)}
.obs{margin:16px 0 0;background:#1f1f1f;border-left:5px solid var(--ambar);padding:12px 14px;border-radius:0 8px 8px 0}
.obs p{margin:0;white-space:pre-line}
.obs small{display:block;margin-top:6px;color:var(--gris);font-size:13px}
.nota{font-size:13px;color:var(--gris);margin:-6px 0 10px}

/* filas de estado */
.fila{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.fila:first-of-type{border-top:0}
.fila-nombre{font-weight:600;color:var(--titulo)}
.fila-sub{display:block;font-size:14.5px;color:var(--gris);margin-top:2px;font-weight:400}
.tag{flex:none;font-size:13.5px;font-weight:700;border-radius:6px;padding:4px 8px;white-space:nowrap;line-height:1.2}
.t-ok{color:var(--ok-tx);background:var(--ok-bg)}
.t-av{color:var(--av-tx);background:var(--av-bg)}
.t-mal{color:#fff;background:var(--mal)}
.reco .fila-nombre{font-size:18px}

/* reseña en Google */
.resena{padding:22px 0 30px}
.resena-card{position:relative;overflow:hidden;background:var(--ambar);color:var(--negro);border-radius:16px;padding:22px 18px 20px;box-shadow:0 10px 30px rgba(255,192,0,.18)}
.resena-card::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);pointer-events:none}
.resena-card h2{color:var(--negro);margin:0 0 6px;font-size:29px}
.resena-card p{margin:0;font-size:16.5px;font-weight:500;line-height:1.4}
.estrellas{display:flex;gap:6px;margin:0 0 14px}
.estrellas svg{filter:drop-shadow(0 1px 0 rgba(0,0,0,.25))}
.btn-google{margin-top:18px;background:var(--negro);color:#fff;min-height:58px;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn-google .flecha{font-size:22px;line-height:1}
@keyframes brillo{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.18)}}
.estrellas svg{animation:brillo 3.2s ease-in-out infinite}
.estrellas svg:nth-child(2){animation-delay:.12s}.estrellas svg:nth-child(3){animation-delay:.24s}.estrellas svg:nth-child(4){animation-delay:.36s}.estrellas svg:nth-child(5){animation-delay:.48s}

/* control */
.ctrl-fecha{color:var(--gris);font-size:15px;margin:-8px 0 4px}
.ctrl{list-style:none;margin:0;padding:0}
.ctrl li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
.ctrl li:first-child{border-top:0}
.ctrl .okv{display:inline-flex;align-items:center;gap:6px;color:var(--ok-tx);font-weight:700;font-size:14.5px}

/* historial */
details{border-top:1px solid var(--linea)}
details:last-of-type{border-bottom:1px solid var(--linea)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:600;color:var(--titulo)}
summary::-webkit-details-marker{display:none}
summary .km{font:600 18px/1 "Barlow Condensed",sans-serif;color:var(--gris)}
summary .chev{transition:transform .2s}
details[open] summary .chev{transform:rotate(180deg)}
.hist-body{padding:0 0 14px;font-size:15.5px}
.hist-body p{margin:4px 0}
.hist-body .lbl{color:var(--gris)}

/* pie */
footer{background:var(--fondo);border-top:3px solid var(--ambar);color:#e9e9e9;padding:28px 0 calc(34px + env(safe-area-inset-bottom));font-size:15.5px}
footer .nom{font:700 22px/1.1 "Barlow Condensed",sans-serif;color:#fff;margin:0 0 10px}
footer .logo-pie{height:58px;width:auto;display:block;margin:0 0 14px;filter:invert(1) hue-rotate(180deg)}
footer p{margin:6px 0}
footer a{color:var(--ambar)}
footer .wa{display:inline-flex;align-items:center;gap:8px;font-weight:700;text-decoration:none;min-height:44px}
footer .wa span{text-decoration:underline;text-underline-offset:3px}
footer .legal{margin-top:18px;font-size:13px;color:#a9a9a9}
.vacio{color:var(--gris)}

@media (prefers-reduced-motion: reduce){ .strip{transition:none} summary .chev{transition:none} .estrellas svg{animation:none} }
@media (min-width:600px){ .drum{width:46px;height:66px} .strip span{height:66px;font-size:48px} }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var v = (q.get('v') || '').trim();
  if (q.get('modo') === 'sticker' && v) { location.replace('sticker.html?v=' + encodeURIComponent(v)); return; }
  if (!v) { location.replace('taller.html'); return; }
  var app = document.getElementById('app');
  var caja = 'min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:0 24px;';
  app.innerHTML = '<div style="' + caja + 'color:#a3a9b1;font-size:16px"><img src="logo.png" alt="Malelo" style="height:46px;filter:invert(1) hue-rotate(180deg)"><span>Cargando el registro…</span></div>';
  var pedido = fetch(window.MALELO_API + '?api=cliente&v=' + encodeURIComponent(v)).then(function(r){ return r.json(); });
  window.__arranque = function(){
    pedido.then(function(j){
      if (!j || !j.ok) throw new Error((j && j.error) || 'Error');
      window.DATA = j.data;
      if (j.data && j.data.vehiculo) document.title = 'Service ' + j.data.vehiculo.patente + ' · Malelo';
      window.__main();
    }).catch(function(){
      app.innerHTML = '<div style="' + caja + 'color:#e4e4e4"><p style="margin:0;font-size:17px">No se pudo cargar el registro. Revisá la conexión y probá de nuevo.</p>' +
        '<button type="button" onclick="location.reload()" style="min-height:50px;padding:0 24px;border:0;border-radius:12px;background:#FFC000;color:#000;font:700 17px Barlow,sans-serif;cursor:pointer">Reintentar</button></div>';
    });
  };
})();
</script>
<script>
window.__main = function(){
  var D = window.DATA || {ok:false, negocio:{}};
  var N = D.negocio || {};
  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function parte(iso){var p=String(iso||'').split('-');return p.length===3?{y:+p[0],m:+p[1],d:+p[2]}:null;}
  function fLarga(iso){var p=parte(iso);return p?p.d+' de '+MESES[p.m-1]+' de '+p.y:'';}
  function fCorta(iso){var p=parte(iso);return p?MESES[p.m-1].slice(0,3)+' '+p.y:'';}
  function fMes(iso){var p=parte(iso);return p?MESES[p.m-1]+' de '+p.y:'';}
  function km(n){n=Math.round(+n||0);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
  function lista(a){a=a.filter(Boolean);if(a.length<2)return a.join('');return a.slice(0,-1).join(', ')+' y '+a[a.length-1];}
  function wa(msg){return N.whatsapp?'https://wa.me/'+N.whatsapp+'?text='+encodeURIComponent(msg):'';}
  var ICON_CHAT='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11c0 2.2 1 4.2 2.6 5.6L5 21l4.2-2.2c.9.2 1.8.3 2.8.3 5.1 0 9-3.6 9-8.1S17.1 3 12 3zm-4 9.3a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6zm4 0a1.3 1.3 0 110-2.6 1.3 1.3 0 010 2.6z"/></svg>';
  var ICON_CHECK='<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="#0e6b2f"/><path d="M5.6 10.4l2.9 2.9 5.9-6.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var ICON_WA='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2a9.7 9.7 0 00-8.3 14.8L2.3 21.8l4.9-1.3A9.7 9.7 0 1012 2.2zm0 17.7a8 8 0 01-4.1-1.1l-.3-.2-2.9.8.8-2.8-.2-.3A8 8 0 1112 19.9zm4.4-6c-.2-.1-1.4-.7-1.7-.8-.2-.1-.4-.1-.5.1l-.8 1c-.1.2-.3.2-.5.1a6.5 6.5 0 01-3.2-2.8c-.2-.4.2-.4.7-1.2.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 00-.6.3 2.7 2.7 0 00-.8 2c0 1.2.9 2.3 1 2.5.1.1 1.7 2.6 4.1 3.7 1.5.7 2.1.7 2.9.6.5-.1 1.4-.6 1.6-1.1.2-.6.2-1 .1-1.1l-.4-.2z"/></svg>';
  var ICON_STAR='<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path fill="#000" d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>';
  var ICON_CHEV='<svg class="chev" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var V = D.vehiculo || {};
  var nombreAuto = [V.marca, V.modelo].filter(Boolean).join(' ') || 'Tu vehículo';
  var h = [];

  h.push('<header class="top"><div class="wrap">'+(N.logo?'<img class="logo" src="'+N.logo+'" alt="'+esc(N.nombre)+'">':'<strong>'+esc(N.nombre)+'</strong>')+
         '<div class="top-txt">Registro de<br>mantenimiento</div></div></header>');

  if(!D.ok){
    h.push('<section class="hero"><div class="wrap"><h2>No encontramos este vehículo</h2><p>Puede que el código del sticker esté dañado o que el registro se haya dado de baja. Escribinos y lo revisamos.</p>'+
      (wa('Hola! Escaneé el QR de mi vehículo y no aparece el registro de service.')?'<a class="btn btn-turno" target="_blank" rel="noopener" href="'+esc(wa('Hola! Escaneé el QR de mi vehículo y no aparece el registro de service.'))+'">'+ICON_CHAT+'Escribinos por WhatsApp</a>':'')+
      '</div></section>');
    h.push(pie());
    document.getElementById('app').innerHTML=h.join('');
    return;
  }

  // ---------- HERO ----------
  var P = D.proximo || {};
  var sub = [V.anio, V.version].filter(Boolean).join(', ');
  var hero = '<section class="hero"><div class="wrap">'+
    '<div class="placa" aria-label="Patente '+esc(V.patente)+'"><span class="placa-band" aria-hidden="true">REPÚBLICA ARGENTINA</span><span class="placa-num">'+esc(V.patente)+'</span></div>'+
    '<h1 class="auto">'+esc(nombreAuto)+'</h1>'+(sub?'<p class="auto-sub">'+esc(sub)+'</p>':'');
  if(D.vencidos && D.vencidos.length){
    hero += '<div class="alerta" role="status">Tenés mantenimiento vencido<span>'+esc(lista(D.vencidos))+'</span></div>';
  }
  function odometro(valor){
    var digitos = String(Math.round(valor)); while(digitos.length<6) digitos='0'+digitos;
    var drums = '';
    for(var i=0;i<digitos.length;i++){
      var resto = digitos.length-i;
      if(i>0 && resto%3===0) drums += '<span class="sep" aria-hidden="true"></span>';
      var strip=''; for(var n=0;n<10;n++) strip+='<span>'+n+'</span>';
      drums += '<span class="drum'+(i===digitos.length-1?' ult':'')+'"><span class="strip" data-d="'+digitos[i]+'">'+strip+'</span></span>';
    }
    return '<div class="odo-row"><div class="odo" role="img" aria-label="'+km(valor)+' kilómetros">'+drums+'</div><span class="odo-unit">km</span></div>';
  }
  if(P.km){
    hero += '<p class="prox-label">Próximo service a los</p>'+odometro(P.km)+
      (P.fecha?'<p class="prox-o">o el <strong>'+fLarga(P.fecha)+'</strong>, lo que llegue primero.</p>':'');
  } else if(P.fecha){
    hero += '<p class="prox-label">Próximo service</p><p class="prox-fecha-grande">'+esc(fMes(P.fecha))+'</p>'+
      '<p class="prox-o">a más tardar el <strong>'+fLarga(P.fecha)+'</strong>.</p>';
  } else {
    hero += '<p class="prox-label">Próximo service</p><p class="prox-o vacio">Todavía no hay un vencimiento calculado para este vehículo. Consultanos y lo revisamos.</p>';
  }
  if((P.km||P.fecha) && P.items && P.items.length){
    hero += '<p class="prox-items">Le toca: '+esc(lista(P.items).toLowerCase())+'.</p>';
  }
  var DI = D.distribucion;
  if(DI){
    var dTag = (DI.clave==='vencido'||DI.clave==='cambiar'||DI.kmPasado) ? '<span class="tag t-mal">'+(DI.clave==='cambiar'?'Cambiar':'Vencida')+'</span>' :
               (DI.clave==='proximo'||DI.clave==='agendar') ? '<span class="tag t-av">'+(DI.clave==='agendar'?'Agendar turno':'Se acerca')+'</span>' : '';
    var dUlt = DI.ultFecha ? 'Último cambio: '+(DI.ultKm?'a los '+km(DI.ultKm)+' km, ':'')+'en '+fCorta(DI.ultFecha)+(DI.detalle?' ('+DI.detalle+')':'')+'.' : '';
    if(DI.proxKm){
      hero += '<div class="dist"><p class="prox-label">Cambio de distribución a los '+dTag+'</p>'+odometro(DI.proxKm)+
        (DI.proxFecha?'<p class="prox-o">o el <strong>'+fLarga(DI.proxFecha)+'</strong>, lo que llegue primero.</p>':'')+
        (dUlt?'<p class="prox-items">'+esc(dUlt)+'</p>':'')+'</div>';
    } else if(DI.proxFecha){
      hero += '<div class="dist"><p class="prox-label">Cambio de distribución '+dTag+'</p><p class="prox-fecha-grande">'+esc(fMes(DI.proxFecha))+'</p>'+
        '<p class="prox-o">a más tardar el <strong>'+fLarga(DI.proxFecha)+'</strong>.</p>'+(dUlt?'<p class="prox-items">'+esc(dUlt)+'</p>':'')+'</div>';
    } else if(DI.clave==='cambiar' || DI.clave==='agendar'){
      hero += '<div class="dist"><p class="prox-label">Distribución '+dTag+'</p><p class="prox-o">El mecánico recomienda cambiarla'+(DI.clave==='cambiar'?' cuanto antes':'')+'.</p></div>';
    } else if(DI.revisado || DI.ultFecha){
      hero += '<div class="dist"><p class="prox-label">Distribución</p><p class="prox-o">'+esc(DI.revisado?'Revisada en '+fCorta(DI.revisado)+'.':dUlt)+'</p></div>';
    } else {
      var msgDist = 'Hola! Quería consultar cada cuántos km le toca el cambio de distribución a mi '+nombreAuto+' ('+V.patente+').';
      hero += '<div class="dist-vacio"><strong>Distribución</strong><p>Todavía no tenemos registrado el cambio de distribución de este vehículo. Es un cambio importante: en muchos motores, si la correa se corta, el motor se daña.</p>'+
        (wa(msgDist)?'<a target="_blank" rel="noopener" href="'+esc(wa(msgDist))+'">Consultanos cuándo le toca</a>':'')+'</div>';
    }
  }
  var msgTurno = 'Hola! Quiero pedir un turno de service para mi '+nombreAuto+' ('+V.patente+').';
  if(wa(msgTurno)) hero += '<a class="btn btn-turno" target="_blank" rel="noopener" href="'+esc(wa(msgTurno))+'">'+ICON_CHAT+'Pedir turno por WhatsApp</a>';
  else if(N.telefono) hero += '<a class="btn btn-turno" target="_top" href="tel:'+esc(String(N.telefono).replace(/[^\d+]/g,''))+'">Llamar para pedir turno</a>';
  hero += '</div></section>';
  h.push(hero);

  // ---------- ÚLTIMO SERVICE ----------
  var U = D.ultimo;
  if(U){
    var s = '<section class="banda"><div class="wrap"><h2>Último service</h2>'+
      '<div class="ult-head"><span class="ult-fecha">'+fLarga(U.fecha)+'</span>'+(U.km?'<span class="ult-km">'+km(U.km)+' km</span>':'')+'</div>'+
      (U.aprox?'<p class="nota">Fecha aproximada: registro pasado desde la planilla anterior.</p>':'');
    if(U.cambios && U.cambios.length){
      s += '<ul class="cambios">'+U.cambios.map(function(c){
        return '<li>'+ICON_CHECK+'<span>'+esc(c.item)+(c.detalle?'<span class="det">'+esc(c.detalle)+'</span>':'')+'</span></li>';
      }).join('')+'</ul>';
    } else {
      s += '<p class="vacio">En esta visita no se cambiaron piezas.</p>';
    }
    if(U.revisados && U.revisados.length) s += '<p class="revisados">También revisamos: '+esc(lista(U.revisados).toLowerCase())+'.</p>';
    if(U.obs) s += '<div class="obs"><p>'+esc(U.obs)+'</p><small>Comentario del mecánico</small></div>';
    s += '</div></section>';
    h.push(s);
  }

  // ---------- RESEÑA EN GOOGLE ----------
  if(N.resena){
    h.push('<section class="resena"><div class="wrap"><div class="resena-card">'+
      '<div class="estrellas" aria-hidden="true">'+ICON_STAR+ICON_STAR+ICON_STAR+ICON_STAR+ICON_STAR+'</div>'+
      '<h2>¿Cómo te atendimos?</h2>'+
      '<p>Contalo en Google: son 30 segundos y a un negocio de Bragado como el nuestro lo ayuda muchísimo.</p>'+
      '<a class="btn btn-google" target="_blank" rel="noopener" href="'+esc(N.resena)+'">Dejar mi reseña en Google <span class="flecha" aria-hidden="true">→</span></a>'+
      '</div></div></section>');
  }

  // ---------- RECOMENDACIONES ----------
  var R = D.recomendaciones || [];
  if(R.length){
    var r = '<section class="reco"><div class="wrap"><h2>El mecánico recomienda</h2>'+
      R.map(function(x){
        var cambiar = x.estado==='CAMBIAR';
        return '<div class="fila"><span class="fila-nombre">'+esc(x.item)+'<span class="fila-sub">Visto el '+fLarga(x.fecha)+'</span></span>'+
          '<span class="tag '+(cambiar?'t-mal':'t-av')+'">'+(cambiar?'Cambiar':'Agendar turno')+'</span></div>';
      }).join('');
    var msgReco = 'Hola! En el registro de mi '+nombreAuto+' ('+V.patente+') me recomiendan: '+lista(R.map(function(x){return x.item.toLowerCase();}))+'. ¿Me pasan presupuesto y turno?';
    if(wa(msgReco)) r += '<a class="btn btn-sec" target="_blank" rel="noopener" href="'+esc(wa(msgReco))+'">'+ICON_CHAT+'Pedir presupuesto por WhatsApp</a>';
    r += '</div></section>';
    h.push(r);
  }

  // ---------- ESTADO DEL MANTENIMIENTO ----------
  var I = (D.items||[]).slice();
  if(I.length){
    I = I.map(function(x,i){x._i=i;return x;}).sort(function(a,b){return (b.nivel-a.nivel)||(a._i-b._i);});
    var TXT = {aldia:['Al día','t-ok'], ok:['Revisado OK','t-ok'], proximo:['Se acerca','t-av'], agendar:['Agendar turno','t-av'], vencido:['Vencido','t-mal'], cambiar:['Cambiar','t-mal']};
    var e = '<section><div class="wrap"><h2>Estado del mantenimiento</h2>'+I.map(function(x){
      var t = TXT[x.clave]||['',''];
      var partes = [];
      if(x.ultFecha) partes.push('Cambiado '+(x.ultKm?'a los '+km(x.ultKm)+' km, ':'')+'en '+fCorta(x.ultFecha)+(x.detalle?' ('+x.detalle+')':'')+'.');
      if(x.revisado) partes.push('Revisado en '+fCorta(x.revisado)+'.');
      var prox = [];
      if(x.proxKm) prox.push(km(x.proxKm)+' km');
      if(x.proxFecha) prox.push(fCorta(x.proxFecha));
      if(prox.length) partes.push('Próximo: '+prox.join(' o ')+'.');
      return '<div class="fila"><span class="fila-nombre">'+esc(x.item)+(partes.length?'<span class="fila-sub">'+esc(partes.join(' '))+'</span>':'')+'</span>'+
        '<span class="tag '+t[1]+'">'+t[0]+'</span></div>';
    }).join('')+'</div></section>';
    h.push(e);
  }

  // ---------- CONTROL GENERAL ----------
  var C = D.controles || [];
  if(C.length){
    var c = '<section class="banda"><div class="wrap"><h2>Control general</h2><p class="ctrl-fecha">Revisión del '+fLarga(D.controlesFecha)+'</p>'+
      C.map(function(g){
        return '<h3>'+esc(g.grupo)+'</h3><ul class="ctrl">'+g.items.map(function(it){
          var st = it.estado==='OK' ? '<span class="okv">'+ICON_CHECK+'OK</span>' :
                   it.estado==='AGENDAR' ? '<span class="tag t-av">Agendar turno</span>' :
                   it.estado==='CAMBIAR' ? '<span class="tag t-mal">Cambiar</span>' : '<span class="tag t-ok">Cambiado</span>';
          return '<li><span>'+esc(it.item)+'</span>'+st+'</li>';
        }).join('')+'</ul>';
      }).join('')+'</div></section>';
    h.push(c);
  }

  // ---------- HISTORIAL ----------
  var H = D.historial || [];
  if(H.length > 1){
    var hh = '<section><div class="wrap"><h2>Historial</h2>'+H.map(function(s){
      var cuerpo = '';
      if(s.cambios.length) cuerpo += '<p><span class="lbl">Se cambió:</span> '+esc(lista(s.cambios))+'.</p>';
      if(s.pendientes.length) cuerpo += '<p><span class="lbl">Quedó recomendado:</span> '+esc(lista(s.pendientes))+'.</p>';
      if(s.obs) cuerpo += '<p><span class="lbl">Comentario:</span> '+esc(s.obs)+'</p>';
      if(s.aprox) cuerpo += '<p class="lbl">Fecha aproximada.</p>';
      if(!cuerpo) cuerpo = '<p class="lbl">Revisión general.</p>';
      return '<details><summary><span>'+fLarga(s.fecha)+'</span><span style="display:flex;gap:10px;align-items:center">'+(s.km?'<span class="km">'+km(s.km)+' km</span>':'')+ICON_CHEV+'</span></summary><div class="hist-body">'+cuerpo+'</div></details>';
    }).join('')+'</div></section>';
    h.push(hh);
  }

  h.push(pie());
  document.getElementById('app').innerHTML = h.join('');

  // rodillos del cuentakilómetros
  var strips = document.querySelectorAll('.strip');
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for(var k=0;k<strips.length;k++){
      strips[k].style.transitionDelay = (k*0.09)+'s';
      strips[k].style.transform = 'translateY(-'+(+strips[k].getAttribute('data-d')*10)+'%)';
    }
  });});

  function pie(){
    var f = '<footer><div class="wrap">'+(N.logo?'<img class="logo-pie" src="'+N.logo+'" alt="'+esc(N.nombre||'')+'">':'<p class="nom">'+esc(N.nombre||'')+'</p>');
    if(N.direccion) f += '<p><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(N.direccion)+'">'+esc(N.direccion)+'</a></p>';
    if(N.horario) f += '<p>'+esc(N.horario)+'</p>';
    var msgPie = 'Hola! Te escribo desde el registro de service'+(V.patente?' de mi '+nombreAuto+' ('+V.patente+')':'')+'.';
    if(wa(msgPie)) f += '<p><a class="wa" target="_blank" rel="noopener" href="'+esc(wa(msgPie))+'" aria-label="Escribinos por WhatsApp al '+esc(N.telefono||N.whatsapp)+'">'+ICON_WA+'<span>'+esc(N.telefono||('+'+N.whatsapp))+'</span></a></p>';
    else if(N.telefono) f += '<p><a target="_top" href="tel:'+esc(String(N.telefono).replace(/[^\d+]/g,''))+'">'+esc(N.telefono)+'</a></p>';
    f += '<p class="legal">Registro cargado por el taller en cada visita. Los vencimientos son por kilometraje o por fecha, lo que llegue primero.</p></div></footer>';
    return f;
  }
};
if (window.__arranque) window.__arranque();
</script>
</body>
</html>
